name: update-threat-ledger

on:
  schedule:
    - cron: "11 * * * *"   # checked hourly because GitHub drops/delays scheduled runs; the gate below keeps real runs to ~every 3 hours
  workflow_dispatch: {}

concurrency:
  group: update-threat-ledger
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          last=$(gh run list -R "${{ github.repository }}" -w update-threat-ledger.yml --status success -L 1 --json createdAt -q '.[0].createdAt')
          if [ -z "$last" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          age=$(( ( $(date +%s) - $(date -d "$last" +%s) ) / 60 ))
          echo "last successful update: $last ($age min ago)"
          if [ "$age" -ge 150 ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

  update:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Install browser for Crawl4AI
        run: crawl4ai-setup

      - name: Choose the model (paid key if you add one, otherwise a free local model)
        id: llm
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -n "$OPENROUTER_API_KEY" ]; then
            echo "local=false" >> "$GITHUB_OUTPUT"
          else
            echo "local=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache the local model
        if: steps.llm.outputs.local == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-qwen2.5-3b-v1

      - name: Start a free local model (no account, no key)
        if: steps.llm.outputs.local == 'true'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:11434/api/tags >/dev/null && break; sleep 2; done
          ollama pull qwen2.5:3b

      - name: Collect, extract, build
        env:
          FETCH_LIMIT: "40"
          EXTRACT_LIMIT: "24"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://openrouter.ai/api/v1' }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'google/gemini-2.5-flash' }}
          EXTRACT_MODE: full
        run: |
          if [ "${{ steps.llm.outputs.local }}" = "true" ]; then
            export LLM_BASE_URL=http://localhost:11434/v1 LLM_API_KEY=ollama OPENROUTER_MODEL=qwen2.5:3b EXTRACT_MODE=pointer
          fi
          python main.py all

      - name: Save data back to the repo
        run: |
          git config user.name "intel-bot"
          git config user.email "intel-bot@users.noreply.github.com"
          git add intel.db digest_*.md site/index.html
          git diff --cached --quiet || (git commit -m "data update [skip ci]" && git push)

      - name: Stage site
        run: mkdir public && cp site/index.html public/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v4
